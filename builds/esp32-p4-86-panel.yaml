# CI/local build entry point for the ESP32-P4-86-Panel.
# =============================================================================

substitutions:
  name: "espcontrol-p4-86"
  friendly_name: "ESP32-P4-86-Panel"
  espcontrol_component_url: "file:///config"
  espcontrol_component_ref: "HEAD"

esphome:
  name_add_mac_suffix: true

packages:
  espcontrol: !include ../devices/esp32-p4-86-panel/packages.yaml

wifi:
  ap:
    ssid: "${friendly_name}"

captive_portal:
